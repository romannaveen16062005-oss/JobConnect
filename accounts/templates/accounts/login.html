
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JobConnect</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; display: grid; place-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; width: min(360px, 85%); border-radius: 12px; }
        input, button { box-sizing: border-box; width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid #ccc; }
        button { background: #2563eb; color: white; border: 0; cursor: pointer; }
        .error { color: #b91c1c; }
    </style>
</head>
<body>
<div class="card">
    <h2>Login to JobConnect</h2>

    {% for message in messages %}
        <p class="error">{{ message }}</p>
    {% endfor %}

    <form method="POST">
        {% csrf_token %}
        <input type="email" name="email" placeholder="Email Address" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <p>New user? <a href="{% url 'register' %}">Create Account</a></p>
    <a href="{% url 'job_list' %}">Back to Jobs</a>
</div>
</body>
</html>
